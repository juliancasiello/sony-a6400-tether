# ==============================================================================
# wpa.conf - Configuración de Wi-Fi para Sony a6400 (wpa_supplicant)
# ==============================================================================
# Reemplazá TU_SSID_HOTSPOT con el nombre exacto de la red de tu celular
# y TU_PASSWORD_HOTSPOT con la contraseña del Hotspot.
# ==============================================================================

ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="TU_SSID_HOTSPOT"
    psk="TU_PASSWORD_HOTSPOT"
    key_mgmt=WPA-PSK
    priority=1
}
